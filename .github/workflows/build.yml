name: Build gnirehtet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows exe and Android APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Modern sdkmanager (cmdline-tools 16+) requires JDK 17+.
      # Install JDK 17 first just to run setup-android / sdkmanager.
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-28
            build-tools;28.0.3

      # AGP 3.5.0 + Gradle 5.4.1 only run on JDK 8.
      # Switch JAVA_HOME back to JDK 8 for the Gradle build.
      - name: Set up JDK 8 (for Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Verify Java version
        run: java -version

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Configure cargo linker for Windows target
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-gcc-ar"
          EOF

      - name: Build release for Windows
        working-directory: relay-rust
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Gather artifacts
        run: |
          mkdir -p release
          cp relay-rust/target/x86_64-pc-windows-gnu/release/gnirehtet.exe release/gnirehtet.exe
          cp app/build/outputs/apk/debug/gnirehtet-debug.apk release/gnirehtet-debug.apk
          cp app/build/outputs/apk/release/gnirehtet-release-unsigned.apk release/gnirehtet-release-unsigned.apk
          ls -la release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnirehtet-build
          path: release/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
