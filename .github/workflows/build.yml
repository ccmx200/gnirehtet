name: Build gnirehtet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Android APK and Rust relay binaries
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # On Windows the executable bit of gradlew is lost; restore it.
      - name: Fix gradlew permissions
        run: chmod +x ./gradlew

      # AGP 7.4.2 + Gradle 7.6.4 require JDK 11+ (JDK 17 recommended).
      # The preinstalled sdkmanager also requires JDK 11+.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses and install packages
        run: |
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Accept all SDK licenses non-interactively
          yes | "$SDKMANAGER" --licenses > /dev/null
          # Install the platform and build-tools required by the project (SDK 34)
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        # A debug APK is signed with the auto-generated debug keystore, so it can
        # be installed without a release signing key. The Rust relay installs it
        # via `adb install -r gnirehtet.apk`, which requires a valid signature.
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add Rust cross-compile targets
        run: rustup target add x86_64-pc-windows-gnu x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Install cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu

      - name: Configure cargo linkers for cross targets
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-gcc-ar"

          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release for Windows (x86_64)
        working-directory: relay-rust
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Build release for Linux (x86_64)
        working-directory: relay-rust
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build release for Linux (aarch64)
        working-directory: relay-rust
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Gather and package artifacts
        run: |
          rm -rf release
          mkdir release
          # Android APK (debug-signed, no extra zipping, apk is already a package)
          cp app/build/outputs/apk/debug/gnirehtet-debug.apk release/gnirehtet.apk
          # Windows x86_64
          cp relay-rust/target/x86_64-pc-windows-gnu/release/gnirehtet.exe release/gnirehtet.exe
          (cd release && zip -j gnirehtet-windows-x86_64.zip gnirehtet.exe)
          # Linux x86_64
          cp relay-rust/target/x86_64-unknown-linux-gnu/release/gnirehtet release/gnirehtet-linux-x86_64
          (cd release && zip -j gnirehtet-linux-x86_64.zip gnirehtet-linux-x86_64)
          # Linux aarch64
          cp relay-rust/target/aarch64-unknown-linux-gnu/release/gnirehtet release/gnirehtet-linux-aarch64
          (cd release && zip -j gnirehtet-linux-aarch64.zip gnirehtet-linux-aarch64)
          ls -la release/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/gnirehtet.apk
            release/gnirehtet-windows-x86_64.zip
            release/gnirehtet-linux-x86_64.zip
            release/gnirehtet-linux-aarch64.zip
          body: |
            ## gnirehtet v2.7.0

            ### Performance (focus of this release)
            - **Rust relay release profile hardened**: `lto = "fat"`, `codegen-units = 1`,
              `panic = "abort"`, `opt-level = 3`, `strip = true` — smaller binary with maximum
              runtime optimization.
            - **Larger relay buffers**: `client_to_network` 16× and `network_to_client` 64×
              `MAX_PACKET_LENGTH`; selector slab and poll events capacity raised to 4096 — reduces
              syscalls and event-loop iterations under load.
            - **Android I/O throughput**: `Forwarder.BUFSIZE` doubled to 128 KiB; executor pool
              bumped to 4 threads to avoid starving the wake-up workaround.
            - **Buffered LocalSocket streams** in `RelayTunnel` (64 KiB BufferedInputStream /
              BufferedOutputStream) — cuts JNI round-trips to the native socket layer.
            - Faster client reconnect (2s) retained from 2.6.0.

            ### Platform / SDK
            - Android `compileSdkVersion` / `targetSdkVersion` raised to **34**.
            - AGP upgraded to **7.4.2**, Gradle wrapper to **7.6.4**.
            - Declared `foregroundServiceType="systemExempted"` for the VPN service and the
              matching `FOREGROUND_SERVICE_SYSTEM_EXEMPTED` permission for API 34 compliance.
            - `testInstrumentationRunner` migrated to `androidx.test.runner.AndroidJUnitRunner`.

            ### Carried over from 2.6.0
            - Demand mode (auto-recovery on device disconnect).
            - Chinese (Simplified) localization; Spanish removed.
            - `TCP_NODELAY` on client tunnel and outbound TCP connections.
            - Removed redundant system title bar in the launcher activity.
            - Modern Rust lifetime syntax (`<'_>`); `jcenter()` → `mavenCentral()`.

            **Full changelog**: https://github.com/ccmx200/gnirehtet/commits/main
