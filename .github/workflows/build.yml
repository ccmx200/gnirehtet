name: Build gnirehtet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Android APK and Rust relay binaries
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # On Windows the executable bit of gradlew is lost; restore it.
      - name: Fix gradlew permissions
        run: chmod +x ./gradlew

      # The preinstalled sdkmanager (cmdline-tools 9.0+) requires JDK 11+.
      # Install JDK 17 first to run sdkmanager for license acceptance and
      # package installation.
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses and install packages
        run: |
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Accept all SDK licenses non-interactively
          yes | "$SDKMANAGER" --licenses > /dev/null
          # Install the platform and build-tools required by the project
          "$SDKMANAGER" "platforms;android-28" "build-tools;28.0.3"

      # AGP 3.5.0 + Gradle 5.4.1 only run on JDK 8.
      # Switch JAVA_HOME back to JDK 8 for the Gradle build.
      - name: Set up JDK 8 (for Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Verify Java version
        run: java -version

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        # A debug APK is signed with the auto-generated debug keystore, so it can
        # be installed without a release signing key. The Rust relay installs it
        # via `adb install -r gnirehtet.apk`, which requires a valid signature.
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add Rust cross-compile targets
        run: rustup target add x86_64-pc-windows-gnu x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Install cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu

      - name: Configure cargo linkers for cross targets
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-gcc-ar"

          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release for Windows (x86_64)
        working-directory: relay-rust
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Build release for Linux (x86_64)
        working-directory: relay-rust
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build release for Linux (aarch64)
        working-directory: relay-rust
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Gather and package artifacts
        run: |
          rm -rf release
          mkdir release
          # Android APK (debug-signed, no extra zipping, apk is already a package)
          cp app/build/outputs/apk/debug/gnirehtet-debug.apk release/gnirehtet.apk
          # Windows x86_64
          cp relay-rust/target/x86_64-pc-windows-gnu/release/gnirehtet.exe release/gnirehtet.exe
          (cd release && zip -j gnirehtet-windows-x86_64.zip gnirehtet.exe)
          # Linux x86_64
          cp relay-rust/target/x86_64-unknown-linux-gnu/release/gnirehtet release/gnirehtet-linux-x86_64
          (cd release && zip -j gnirehtet-linux-x86_64.zip gnirehtet-linux-x86_64)
          # Linux aarch64
          cp relay-rust/target/aarch64-unknown-linux-gnu/release/gnirehtet release/gnirehtet-linux-aarch64
          (cd release && zip -j gnirehtet-linux-aarch64.zip gnirehtet-linux-aarch64)
          ls -la release/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/gnirehtet.apk
            release/gnirehtet-windows-x86_64.zip
            release/gnirehtet-linux-x86_64.zip
            release/gnirehtet-linux-aarch64.zip
          body: |
            ## gnirehtet v2.6.0

            ### New features
            - **Demand mode**: new `gnirehtet demand` command that starts reverse tethering with
              auto-recovery. It monitors the device connection via ADB and automatically restarts
              the client (re-establishing the adb reverse tunnel and re-launching) when a device
              disconnect is detected and it reconnects.
            - **Chinese (Simplified) localization** for the Android client (`zh-rCN`).
              Spanish strings removed; the default locale is now English.

            ### Performance
            - IPv4 throughput optimizations on the Rust relay:
              - `TCP_NODELAY` set on both client tunnel and outbound TCP connections to reduce
                latency for small packets.
              - Larger buffers on the client and TCP connection paths
                (`network_to_client` 32×, `client_to_network` 8× `MAX_PACKET_LENGTH`).
            - Android client reconnect delay reduced from 5000ms to 2000ms for faster recovery.

            ### UI
            - Removed the redundant system title bar in the launcher activity (the app draws its
              own header, so the default action bar was duplicated).

            ### Code quality
            - Updated Rust source to the new lifetime elision syntax (`<'_>`) required by recent
              Rust toolchains (`mismatched_lifetime_syntaxes` lint).
            - Migrated Gradle build from `jcenter()` to `mavenCentral()`.

            ### Builds
            - GitHub Actions workflow now produces release artifacts for:
              - Android APK (`gnirehtet.apk`)
              - Windows x86_64 (`gnirehtet-windows-x86_64.zip`)
              - Linux x86_64 (`gnirehtet-linux-x86_64.zip`)
              - Linux aarch64 (`gnirehtet-linux-aarch64.zip`)

            **Full changelog**: https://github.com/ccmx200/gnirehtet/commits/main
