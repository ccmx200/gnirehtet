name: Build gnirehtet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows executable (Rust)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: relay-rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Configure cargo linker for Windows target
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-gcc-ar"
          EOF

      - name: Build release for Windows
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: gnirehtet-windows
          path: relay-rust/target/x86_64-pc-windows-gnu/release/gnirehtet.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-28
            build-tools;28.0.3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gnirehtet-apk-debug
          path: app/build/outputs/apk/debug/gnirehtet-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gnirehtet-apk-release
          path: app/build/outputs/apk/release/gnirehtet-release-unsigned.apk

  release:
    name: Create release
    needs: [build-windows, build-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mkdir -p release
          cp artifacts/gnirehtet-windows/gnirehtet.exe release/gnirehtet.exe
          cp artifacts/gnirehtet-apk-debug/gnirehtet-debug.apk release/gnirehtet.apk
          cp artifacts/gnirehtet-apk-release/gnirehtet-release-unsigned.apk release/gnirehtet-release-unsigned.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
